{% extends "base.html" %}

{% block title %}文件浏览器 - LTFS 管理系统{% endblock %}

{% block extra_css %}
<link href="{{ url_for('static', filename='css/file_browser.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-md-12">
      <h2 class="mb-4">📁 文件浏览器</h2>
    </div>
  </div>

  <div class="row">
    <!-- 左侧：容器内文件浏览器 -->
    <div class="col-md-5">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">💻 容器内 (/mnt)</h5>
          <button class="btn btn-sm btn-outline-primary" onclick="refreshBrowser('left')">
            <span>🔄</span> 刷新
          </button>
        </div>
        <div class="card-body">
          <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb" id="leftBreadcrumb">
              <li class="breadcrumb-item"><a href="#" data-path="/mnt">/mnt</a></li>
            </ol>
          </nav>
          <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
            <table class="table table-hover table-sm" id="leftFileTable">
              <thead>
                <tr>
                  <th style="width: 40px;">
                    <input type="checkbox" id="leftSelectAll">
                  </th>
                  <th>名称</th>
                  <th style="width: 100px;">大小</th>
                </tr>
              </thead>
              <tbody id="leftFileTableBody">
                <!-- 文件列表将通过 JS 填充 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- 中间：传输按钮 -->
    <div class="col-md-2 d-flex align-items-center justify-content-center">
      <div class="d-flex flex-column gap-3">
        <button class="btn btn-primary btn-lg" id="transferRightBtn" onclick="transferToRight()" disabled>
          <span>→</span>
        </button>
        <button class="btn btn-primary btn-lg" id="transferLeftBtn" onclick="transferToLeft()" disabled>
          <span>←</span>
        </button>
        <div class="text-center">
          <select class="form-select" id="transferType" style="width: 120px;">
            <option value="copy">复制</option>
            <option value="move">移动</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 右侧：磁带文件浏览器 -->
    <div class="col-md-5">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">📼 磁带 (/media/tape)</h5>
          <button class="btn btn-sm btn-outline-primary" onclick="refreshBrowser('right')">
            <span>🔄</span> 刷新
          </button>
        </div>
        <div class="card-body">
          <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb" id="rightBreadcrumb">
              <li class="breadcrumb-item"><a href="#" data-path="/media/tape">/media/tape</a></li>
            </ol>
          </nav>
          <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
            <table class="table table-hover table-sm" id="rightFileTable">
              <thead>
                <tr>
                  <th style="width: 40px;">
                    <input type="checkbox" id="rightSelectAll">
                  </th>
                  <th>名称</th>
                  <th style="width: 100px;">大小</th>
                </tr>
              </thead>
              <tbody id="rightFileTableBody">
                <!-- 文件列表将通过 JS 填充 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 传输进度面板 -->
  <div class="row mt-4">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">📊 传输进度</h5>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadTransfers()">
            <span>🔄</span> 刷新
          </button>
        </div>
        <div class="card-body" id="transfersContainer">
          <p class="text-muted">暂无传输任务</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/file_browser.js') }}"></script>
{% endblock %}
