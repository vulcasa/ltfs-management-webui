<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTO-6 磁带管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/slide-dialog.css') }}">
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --success-color: #198754;
            --danger-color: #dc3545;
            --light-color: #f8f9fa;
            --dark-color: #212529;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f7fa;
            min-height: 100vh;
        }
        
        .sidebar {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            padding: 0;
        }
        
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 24px;
            border-radius: 0;
            transition: all 0.3s ease;
        }
        
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .sidebar .nav-link i {
            margin-right: 10px;
        }
        
        .main-content {
            padding: 24px;
        }
        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 24px;
        }
        
        .card-header {
            background: white;
            border-bottom: 1px solid #e9ecef;
            border-radius: 12px 12px 0 0 !important;
            font-weight: 600;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-mounted {
            background: #d1e7dd;
            color: #0f5132;
        }
        
        .status-unmounted {
            background: #fff3cd;
            color: #664d03;
        }
        
        .status-ejected {
            background: #f8d7da;
            color: #842029;
        }
        
        .btn-primary {
            background: #0d6efd;
            border: none;
        }
        
        .btn-primary:hover {
            background: #0b5ed7;
        }
        
        .progress-bar {
            transition: width 0.5s ease;
        }
        
        .sidebar-header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h4 {
            margin: 0;
            font-weight: 600;
        }
        
        .table-hover tbody tr:hover {
            background-color: rgba(13, 110, 253, 0.05);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="sidebar-header">
                    <h4>📼 LTO-6 磁带管理</h4>
                </div>
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                            <span>🏠</span> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/tapes" class="nav-link {% if request.path == '/tapes' %}active{% endif %}">
                            <span>📼</span> 磁带管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/files" class="nav-link {% if request.path == '/files' %}active{% endif %}">
                            <span>📁</span> 文件管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/logs" class="nav-link {% if request.path == '/logs' %}active{% endif %}">
                            <span>📋</span> 操作日志
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/backup" class="nav-link {% if request.path == '/backup' %}active{% endif %}">
                            <span>💾</span> 备份与恢复
                        </a>
                    </li>
                </ul>
            </nav>
            
            <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/slide-dialog.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('LTO-6 磁带管理系统已加载');
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
